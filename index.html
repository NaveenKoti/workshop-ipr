  <p class="dates">31 October – 1 November 2026</p>
  <hr>
  <div id="portal"></div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxHLdREznCJ0LSB8MCGr92BF5jnawPAeCqu-HffAZ8un0f_euUeL1cEE6jMPk-Ed0IvNw/exec",
  TEMPLATE_URL: "certificate_template.jpg",   // blank certificate image in the same repo folder
  RATINGS: ["Excellent", "Very Good", "Good", "Satisfactory"],
  SESSIONS: [
    { day: "Day 1 · 31 Oct 2026 · 10:00 a.m. – 11:30 a.m.",
      speaker: "Dr. Anindya Sircar", role: "IP Consultant",
      topic: "Patents & Biotechnology" },
    { day: "Day 1 · 31 Oct 2026 · 11:45 a.m. – 1:15 p.m.",
      speaker: "Mr. Bharat Goyal", role: "Assistant Controller of Patents & Designs",
      topic: "Patents in India: From Innovation to Protection" },
    { day: "Day 2 · 1 Nov 2026 · 10:00 a.m. – 11:30 a.m.",
      speaker: "Ms. Preeti Dahiya", role: "Senior Examiner of Trademarks & Geographical Indications",
      topic: "Trade Marks in India: From Brand Creation to Legal Protection" },
    { day: "Day 2 · 1 Nov 2026 · 11:45 a.m. – 1:15 p.m.",
      speaker: "Mr. Prashant Bhairappanavar", role: "Assistant Registrar, Trademarks, Geographical Indications & Copyright",
      topic: "Understanding Geographical Indications (GI)" }
  ],
  // Tuned on the real certificate: centres the name in the blank gap between
  // "This is to certify that" and "has participated in..."
  NAME_Y_RATIO: 0.535,       // vertical position of the name (0 = top, 1 = bottom)
  NAME_MAX_WIDTH_RATIO: 0.72, // name shrinks to fit this share of the page width
  NAME_FONT_RATIO: 0.042,    // starting font size as a share of image width
  NAME_FONT: '"Times New Roman", Times, serif',
  NAME_COLOR: "#1a1a4e"      // dark navy, matches the certificate text
};
/* ========================================== */

const $ = (id) => document.getElementById(id);
const portal = $("portal");
const EMAIL_RE = /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/;

async function api(url, options = {}, timeoutMs = 25000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...options, signal: ctrl.signal });
    return await res.json();
  } finally { clearTimeout(t); }
}

/* ---------- simple views ---------- */
function showMessage(title, text, color) {
  portal.replaceChildren();
  const box = document.createElement("div");
  box.className = "center";
  const h = document.createElement("h3");
  h.textContent = title;
  if (color) h.style.color = color;
  const p = document.createElement("p");
  p.textContent = text;
  box.append(h, p);
  portal.append(box);
  return box;
}

function showDone(title, name, pdf) {
  const box = showMessage(title, "Certificate for " + name + " is ready.", "var(--ok)");
  // Some in-app browsers (WhatsApp, Instagram) block automatic downloads, so offer a manual one.
  const a = document.createElement("a");
  a.className = "fallback";
  a.href = URL.createObjectURL(pdf.blob);
  a.download = pdf.filename;
  a.target = "_blank";
  a.textContent = "Download didn't start? Tap here.";
  box.append(a);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = "Download certificate again";
  btn.onclick = () => a.click();
  box.append(btn);
}

/* ---------- form ---------- */
function buildForm() {
  portal.innerHTML = `
    <form id="feedbackForm" novalidate>
      <div class="form-group">
        <label class="lbl" for="emailInput">Email address *</label>
        <input type="email" id="emailInput" placeholder="name@example.com" autocomplete="email" inputmode="email" required>
        <div id="emailStatus" class="status" aria-live="polite"></div>
      </div>

      <div id="dupBox" class="notice hidden">
        <p>Feedback for this email is already recorded.</p>
        <button id="reDownloadBtn" type="button">Download my certificate</button>
      </div>

      <div class="form-group">
        <label class="lbl" for="nameInput">Full name (as it should appear on the certificate) *</label>
        <input type="text" id="nameInput" maxlength="80" autocomplete="name" placeholder="e.g., Adv. Rajesh Kulkarni" required>
        <div class="hint">Capitalisation is fixed automatically. Please check your spelling.</div>
      </div>

      <div class="lbl">Rate each session *</div>
      <div id="ratings"></div>

      <div class="form-group">
        <label class="lbl" for="comments">Suggestions / feedback</label>
        <textarea id="comments" rows="3" maxlength="1000" placeholder="What worked well? What could improve?"></textarea>
      </div>

      <button type="submit" id="submitBtn" disabled>Enter your email to continue</button>
      <div id="submitStatus" class="status" aria-live="polite"></div>
      <p class="privacy">Your email is used only to issue your certificate and avoid duplicate entries.</p>
    </form>`;

  const wrap = $("ratings");
  CONFIG.SESSIONS.forEach((s, i) => {
    const box = document.createElement("div");
    box.className = "session";
    box.id = "session" + i;
    box.setAttribute("role", "radiogroup");
    box.setAttribute("aria-labelledby", "who" + i);

    const day = document.createElement("div"); day.className = "day"; day.textContent = s.day;
    const who = document.createElement("div"); who.className = "who"; who.id = "who" + i; who.textContent = s.speaker;
    const role = document.createElement("div"); role.className = "role"; role.textContent = s.role;
    const topic = document.createElement("div"); topic.className = "topic"; topic.textContent = "“" + s.topic + "”";
    const chips = document.createElement("div"); chips.className = "chips";
    CONFIG.RATINGS.forEach(r => {
      const l = document.createElement("label"); l.className = "chip";
      const inp = document.createElement("input"); inp.type = "radio"; inp.name = "rating" + i; inp.value = r;
      inp.addEventListener("change", () => box.classList.remove("missing"));
      const sp = document.createElement("span"); sp.textContent = r;
      l.append(inp, sp);
      chips.append(l);
    });
    box.append(day, who, role, topic, chips);
    wrap.append(box);
  });

  wireEmailCheck();
  $("feedbackForm").addEventListener("submit", onSubmit);
}

/* ---------- email check runs in the background; only Submit waits for it ---------- */
// states: idle | checking | ready | unknown (pre-check failed; server will decide) | exists | blocked
let emailState = "idle";
let checkSeq = 0;
let debounce;

function setEmailState(state) {
  emailState = state;
  const btn = $("submitBtn");
  const canSubmit = state === "ready" || state === "unknown";
  btn.disabled = !canSubmit;
  btn.textContent =
    state === "checking" ? "Verifying your email..." :
    canSubmit ? "Submit feedback & get certificate" :
    state === "exists" ? "Already submitted" :
    state === "blocked" ? "Email not on attendee list" :
    "Enter your email to continue";
  $("dupBox").classList.toggle("hidden", state !== "exists");
}

function wireEmailCheck() {
  const input = $("emailInput");
  input.addEventListener("input", () => {
    clearTimeout(debounce);
    checkSeq++;                          // invalidates any check still in flight
    $("emailStatus").textContent = "";
    setEmailState("idle");
    debounce = setTimeout(checkEmail, 700);
  });
  input.addEventListener("blur", () => {
    clearTimeout(debounce);
    if (emailState === "idle") checkEmail();
  });
}

async function checkEmail() {
  const email = $("emailInput").value.trim().toLowerCase();
  const status = $("emailStatus");
  if (!EMAIL_RE.test(email)) {
    if (email) { status.style.color = "var(--err)"; status.textContent = "Please enter a valid email address."; }
    return;
  }
  const seq = ++checkSeq;
  setEmailState("checking");
  status.style.color = "var(--muted)";
  status.textContent = "Checking in the background. You can keep filling the form.";
  try {
    const data = await api(`${CONFIG.SCRIPT_URL}?action=checkEmail&email=${encodeURIComponent(email)}`);
    if (seq !== checkSeq) return;         // a newer edit superseded this check
    if (!data.ok) { setEmailState("unknown"); status.style.color = "var(--muted)"; status.textContent = ""; return; }
    if (data.allowed === false) {
      setEmailState("blocked");
      status.style.color = "var(--err)";
      status.textContent = "This email is not on the attendee list. Please contact the organisers.";
    } else if (data.exists) {
      setEmailState("exists");
      status.style.color = "var(--err)";
      status.textContent = "Feedback already recorded for this email.";
      $("reDownloadBtn").onclick = () => reDownload(data.name);
    } else {
      setEmailState("ready");
      status.style.color = "var(--ok)";
      status.textContent = "✓ Email verified.";
    }
  } catch (_) {
    if (seq !== checkSeq) return;
    // Pre-check failed (network or server). Don't block: the server re-checks on submit anyway.
    setEmailState("unknown");
    status.style.color = "var(--muted)";
    status.textContent = "";
  }
}

async function reDownload(name) {
  const btn = $("reDownloadBtn");
  btn.disabled = true; btn.textContent = "Generating...";
  try {
    const pdf = await buildCertificate(name);
    triggerDownload(pdf);
    showDone("Certificate downloaded", name, pdf);
  } catch (err) {
    btn.disabled = false; btn.textContent = "Download my certificate";
    $("emailStatus").style.color = "var(--err)";
    $("emailStatus").textContent = "Could not build the certificate: " + err.message;
  }
}

/* ---------- submit ---------- */
let submitting = false;
async function onSubmit(e) {
  e.preventDefault();
  if (submitting || !(emailState === "ready" || emailState === "unknown")) return;
  const status = $("submitStatus");
  const btn = $("submitBtn");

  const name = $("nameInput").value.trim();
  const email = $("emailInput").value.trim().toLowerCase();
  const ratings = CONFIG.SESSIONS.map((_, i) => {
    const c = document.querySelector(`input[name="rating${i}"]:checked`);
    return c ? c.value : "";
  });

  status.style.color = "var(--err)";
  if (name.length < 3) { status.textContent = "Please enter your full name."; $("nameInput").focus(); return; }
  const firstMissing = ratings.findIndex(r => !r);
  if (firstMissing >= 0) {
    ratings.forEach((r, i) => $("session" + i).classList.toggle("missing", !r));
    status.textContent = "Please rate every session.";
    $("session" + firstMissing).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  submitting = true;
  btn.disabled = true;
  btn.textContent = "Preparing...";
  status.style.color = "var(--muted)";
  status.textContent = "";

  const payload = {
    name: clientCleanName(name), email,
    speaker1: ratings[0], speaker2: ratings[1], speaker3: ratings[2], speaker4: ratings[3],
    comments: $("comments").value
  };
  savePending(payload);      // remembered on this phone until the server confirms
  await deliver(payload, true);
  submitting = false;
}

/* ---------- certificate first, saving in the background ---------- */
const PENDING_KEY = "ipr_pending_v1";
function loadPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "null"); } catch (_) { return null; } }
function savePending(p) { try { localStorage.setItem(PENDING_KEY, JSON.stringify(p)); } catch (_) {} }
function clearPending() { try { localStorage.removeItem(PENDING_KEY); } catch (_) {} }

// Same cleaning the server does (letters of any script, spaces . ' - ; Title Case)
function clientCleanName(v) {
  return String(v || "")
    .replace(/[^\p{L}\p{M}\s.'\-]/gu, "")
    .replace(/\s+/g, " ").trim().slice(0, 80).toLowerCase()
    .replace(/(^|[\s.'\-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
}

function addDownloadControls(box, pdf, before) {
  // Some in-app browsers (WhatsApp, Instagram) block automatic downloads, so offer a manual one.
  const a = document.createElement("a");
  a.className = "fallback";
  a.href = URL.createObjectURL(pdf.blob);
  a.download = pdf.filename;
  a.target = "_blank";
  a.textContent = "Download didn't start? Tap here.";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = "Download certificate again";
  btn.onclick = () => a.click();
  box.insertBefore(a, before || null);
  box.insertBefore(btn, before || null);
}

async function deliver(payload, autoDownload) {
  const name = payload.name;
  const box = showMessage("Thank you!", "Preparing your certificate...", "var(--ok)");
  const saveEl = document.createElement("div");
  saveEl.className = "status";
  saveEl.setAttribute("aria-live", "polite");
  box.append(saveEl);
  const saving = saveInBackground(payload, saveEl);     // starts immediately, in parallel
  try {
    const pdf = await buildCertificate(name);
    if (autoDownload) triggerDownload(pdf);
    box.querySelector("p").textContent = "Certificate for " + name + " is ready.";
    addDownloadControls(box, pdf, saveEl);
  } catch (err) {
    box.querySelector("p").textContent = "Your feedback is being saved, but the certificate could not be built: " + err.message;
    const retry = document.createElement("button");
    retry.type = "button";
    retry.textContent = "Try building the certificate again";
    retry.onclick = () => deliver(payload, true);
    box.insertBefore(retry, saveEl);
  }
  await saving;
}

function keepPageOpen(on) { window.onbeforeunload = on ? (e) => { e.preventDefault(); e.returnValue = ""; } : null; }

async function saveInBackground(payload, el) {
  const MAX_TRIES = 12;
  const body = JSON.stringify(payload);
  keepPageOpen(true);
  el.style.color = "var(--muted)";
  el.textContent = "Saving your feedback... please keep this page open.";
  for (let attempt = 1; attempt <= MAX_TRIES; attempt++) {
    try {
      // Retrying is safe: the server answers "duplicate" for an email it already has.
      const res = await api(CONFIG.SCRIPT_URL, {
        method: "POST",
        // text/plain avoids a CORS preflight, which Apps Script can't answer
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body
      }, 40000);
      if (res.status === "success" || res.status === "duplicate") {
        // Double-check with the sheet itself before telling the person it is saved.
        let confirmed = true;
        try {
          const chk = await api(`${CONFIG.SCRIPT_URL}?action=checkEmail&email=${encodeURIComponent(payload.email)}`, {}, 20000);
          if (chk && chk.ok && chk.exists === false) confirmed = false;
        } catch (_) { /* can't verify right now: trust the server's answer */ }
        if (!confirmed) throw new Error("not found in sheet yet");   // falls through to the retry wait
        clearPending(); keepPageOpen(false);
        el.style.color = "var(--ok)";
        el.textContent = "✓ Your feedback has been saved.";
        return true;
      }
      if (!res.retry) {                       // a real rejection (e.g. email not allowed): don't loop
        clearPending(); keepPageOpen(false);
        el.style.color = "var(--err)";
        el.textContent = (res.message || "Your feedback could not be saved.") + " Your certificate is still valid.";
        return false;
      }
    } catch (_) { /* timeout, network blip or busy server: wait and try again */ }
    if (attempt < MAX_TRIES) {
      el.textContent = "Saving your feedback... many people are submitting, retrying automatically. Please keep this page open.";
      await new Promise(r => setTimeout(r, Math.min(2000 * attempt, 15000) + Math.random() * 3000));
    }
  }
  keepPageOpen(false);
  el.style.color = "var(--err)";
  el.textContent = "Your feedback is not saved yet. Your certificate is fine. ";
  const again = document.createElement("button");
  again.type = "button";
  again.textContent = "Try saving again";
  again.onclick = () => { again.remove(); saveInBackground(payload, el); };
  el.append(again);
  return false;
}

/* ---------- certificate (runs entirely in the browser) ---------- */
let templatePromise;
function loadTemplate() {
  if (!templatePromise) {
    templatePromise = new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => { templatePromise = null; reject(new Error("certificate template could not be loaded")); };
      img.src = CONFIG.TEMPLATE_URL;
    });
  }
  return templatePromise;
}

async function buildCertificate(name) {
  const img = await loadTemplate();
  const canvas = document.createElement("canvas");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);

  let size = Math.round(canvas.width * CONFIG.NAME_FONT_RATIO);
  const maxW = canvas.width * CONFIG.NAME_MAX_WIDTH_RATIO;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = CONFIG.NAME_COLOR;
  do {
    ctx.font = `bold ${size}px ${CONFIG.NAME_FONT}`;
    size -= 2;
  } while (ctx.measureText(name).width > maxW && size > 12);
  ctx.fillText(name, canvas.width / 2, canvas.height * CONFIG.NAME_Y_RATIO);

  const { jsPDF } = window.jspdf;
  const landscape = canvas.width >= canvas.height;
  // Page takes the certificate's own proportions (it is not A4), so nothing is stretched
  const pageW = landscape ? 297 : 210;
  const pageH = pageW * canvas.height / canvas.width;
  const pdf = new jsPDF({ orientation: landscape ? "landscape" : "portrait", unit: "mm", format: [pageW, pageH] });
  pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0,
    pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());

  return {
    blob: pdf.output("blob"),
    // \p{M} keeps vowel signs in Devanagari/Kannada names so file names don't come out garbled
    filename: name.replace(/[^\p{L}\p{M}\p{N}]+/gu, "_") + "_Certificate.pdf"
  };
}

function triggerDownload(pdf) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(pdf.blob);
  a.download = pdf.filename;
  document.body.append(a);
  a.click();
  a.remove();
}

/* ---------- start: signed re-issue link, or normal form ---------- */
window.addEventListener("DOMContentLoaded", async () => {
  const q = new URLSearchParams(location.search);
  const email = q.get("email"), name = q.get("name"), sig = q.get("sig");

  // A link that lost part of itself in copy/paste: say so instead of silently showing the form
  if ((email || name || sig) && !(email && name && sig)) {
    showMessage("Incomplete link", "This certificate link looks cut off. Please copy the full link, or ask the organisers to resend it.", "var(--err)");
    return;
  }

  if (email && name && sig) {
    showMessage("Verifying your certificate link...", "One moment.");
    try {
      const r = await api(`${CONFIG.SCRIPT_URL}?action=verifySignedLink&email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}&sig=${encodeURIComponent(sig)}`);
      if (!r.valid) { showMessage("Invalid link", r.message || "This link is not valid.", "var(--err)"); return; }
      const pdf = await buildCertificate(r.name);
      triggerDownload(pdf);
      showDone("Certificate downloaded", r.name, pdf);
    } catch (err) {
      showMessage("Something went wrong", "Could not verify the link: " + err.message, "var(--err)");
    }
    return;
  }
  const pending = loadPending();
  if (pending && pending.name && pending.email) { await deliver(pending, false); return; }   // finish a save that was interrupted
  buildForm();
});
</script>
